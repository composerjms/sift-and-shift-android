name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # GitHub's Ubuntu runners already have the Android SDK (ANDROID_HOME), so no extra setup step
      - name: Install and sync Capacitor
        run: |
          npm ci
          npx cap sync android

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk "Sift-and-Shift-v9-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Sift-and-Shift-apk
          path: Sift-and-Shift-v9-build${{ github.run_number }}.apk

      - name: Publish as a release (easy to download on the tablet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "Sift-and-Shift-v9-build${{ github.run_number }}.apk" \
            --title "Sift & Shift v9, build ${{ github.run_number }}" \
            --notes "Install on the tablet: open this page in Chrome, tap the .apk, then Install (allow installs from Chrome the first time). Saves are kept when you install a newer build over an older one." \
            --latest
